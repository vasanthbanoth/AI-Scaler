<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vasanth Banoth — AI Persona</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#0b0f14; --panel:#121a24; --border:#1e2a3a; --text:#e8eef6; --muted:#8fa3b8; --accent:#3dd6c6; --accent-dim:#2a9d90; --user:#1a3a4a; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans",system-ui,sans-serif; }
    .shell { max-width:820px; margin:0 auto; padding:1rem 1.25rem 1.5rem; min-height:100vh; display:flex; flex-direction:column; }
    header { display:flex; justify-content:space-between; gap:1rem; border-bottom:1px solid var(--border); padding-bottom:1rem; }
    h1 { margin:0; font-size:1.35rem; }
    .sub { color:var(--muted); font-size:.9rem; margin:.25rem 0 0; }
    .links a { color:var(--accent); margin-left:.75rem; font-size:.9rem; }
    .chip { background:var(--panel); border:1px solid var(--accent-dim); color:var(--accent); border-radius:999px; padding:.35rem .85rem; cursor:pointer; font:inherit; }
    #chat { flex:1; overflow-y:auto; padding:1rem 0; display:flex; flex-direction:column; gap:.75rem; }
    .bubble { border-radius:12px; padding:.75rem 1rem; border:1px solid var(--border); max-width:96%; line-height:1.55; white-space:pre-wrap; }
    .user { background:var(--user); align-self:flex-end; }
    .ai { background:var(--panel); align-self:flex-start; }
    .role { font-size:.7rem; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
    .meta { font-size:.75rem; color:var(--muted); margin-top:6px; }
    .starters { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:.75rem; }
    .starter { background:transparent; border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:.4rem .6rem; font-size:.78rem; cursor:pointer; text-align:left; }
    form { display:grid; grid-template-columns:1fr auto; gap:.5rem; align-items:end; }
    textarea, input { font:inherit; background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:.6rem .75rem; width:100%; }
    .send { background:var(--accent-dim); color:#041018; border:none; border-radius:8px; padding:.65rem 1.1rem; font-weight:600; cursor:pointer; }
    .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; padding:1rem; }
    .modal { background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:1.25rem; width:100%; max-width:420px; display:flex; flex-direction:column; gap:.6rem; }
    .modal.open, .modal-bg.open { display:flex; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <h1>Vasanth Banoth</h1>
        <p class="sub">AI representative · RAG over resume + GitHub</p>
      </div>
      <div class="links">
        <a href="https://github.com/vasanthbanoth" target="_blank" rel="noreferrer">GitHub</a>
        <a href="https://vasanthdev.in" target="_blank" rel="noreferrer">Portfolio</a>
        <button class="chip" type="button" id="bookBtn">Book call</button>
      </div>
    </header>
    <div id="chat"></div>
    <div class="starters" id="starters"></div>
    <form id="form">
      <textarea id="input" rows="2" placeholder="Ask about a repo, resume, or role fit…"></textarea>
      <button class="send" type="submit">Send</button>
    </form>
  </div>
  <div class="modal-bg" id="modalBg">
    <div class="modal open">
      <h3>Book interview (Cal.com)</h3>
      <select id="slotSelect"></select>
      <input id="bName" placeholder="Your name" />
      <input id="bEmail" type="email" placeholder="Email" />
      <textarea id="bNotes" placeholder="Notes (optional)" rows="2"></textarea>
      <div style="display:flex;justify-content:flex-end;gap:.5rem">
        <button type="button" id="cancelBook">Cancel</button>
        <button class="send" type="button" id="confirmBook">Confirm</button>
      </div>
    </div>
  </div>
  <script>
    const STARTERS = [
      "Why is Vasanth a strong fit for Scaler's AI Engineer intern role?",
      "Walk me through Mail-InboxAI — stack and RAG design choices.",
      "What did you build in Josh-AI-TASK?",
      "Show available interview slots this week."
    ];
    const chat = document.getElementById("chat");
    const startersEl = document.getElementById("starters");
    let loading = false;

    function addMsg(role, content, extra = {}) {
      const d = document.createElement("div");
      d.className = "bubble " + (role === "user" ? "user" : "ai");
      let html = `<div class="role">${role === "user" ? "You" : "AI rep"}</div><div>${escapeHtml(content)}</div>`;
      if (extra.sources?.length) html += `<div class="meta">Sources: ${extra.sources.slice(0,4).map(s => s.source + " (" + s.score + ")").join(" · ")}</div>`;
      if (extra.latency_ms) html += `<div class="meta">${extra.latency_ms} ms</div>`;
      d.innerHTML = html;
      chat.appendChild(d);
      d.scrollIntoView({ behavior: "smooth" });
    }

    function escapeHtml(t) {
      return t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    }

    addMsg("assistant", "Hey — I'm Vasanth's AI rep. Ask about his resume, GitHub repos, or book a call. I only answer from ingested corpus.");

    STARTERS.forEach(s => {
      const b = document.createElement("button");
      b.className = "starter";
      b.textContent = s;
      b.onclick = () => send(s);
      startersEl.appendChild(b);
    });

    async function loadSlots() {
      const r = await fetch("/calendar/slots?days=7");
      const data = await r.json();
      const sel = document.getElementById("slotSelect");
      sel.innerHTML = "";
      (data.slots || []).forEach(s => {
        const o = document.createElement("option");
        o.value = s.start;
        o.textContent = s.start + (s.end ? " → " + s.end : "");
        sel.appendChild(o);
      });
      document.getElementById("modalBg").classList.add("open");
      return data;
    }

    document.getElementById("bookBtn").onclick = loadSlots;
    document.getElementById("cancelBook").onclick = () => document.getElementById("modalBg").classList.remove("open");

    document.getElementById("confirmBook").onclick = async () => {
      const body = {
        start_iso: document.getElementById("slotSelect").value,
        name: document.getElementById("bName").value,
        email: document.getElementById("bEmail").value,
        notes: document.getElementById("bNotes").value
      };
      const r = await fetch("/calendar/book", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const data = await r.json();
      document.getElementById("modalBg").classList.remove("open");
      addMsg("assistant", r.ok ? `Booked for ${body.start_iso}. Confirmation email → ${body.email}` : `Booking failed: ${data.detail || data.error || JSON.stringify(data)}`);
    };

    async function send(text) {
      const trimmed = (text || "").trim();
      if (!trimmed || loading) return;
      if (/book|slot|availability|schedule|calendar/i.test(trimmed)) await loadSlots();
      loading = true;
      addMsg("user", trimmed);
      document.getElementById("input").value = "";
      try {
        const r = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: trimmed }) });
        const data = await r.json();
        if (!r.ok) throw new Error(data.detail || "chat error");
        addMsg("assistant", data.reply, { sources: data.sources, latency_ms: data.latency_ms });
      } catch (e) {
        addMsg("assistant", "Backend error: " + e.message + ". Run ingest + set OPENAI_API_KEY.");
      }
      loading = false;
    }

    document.getElementById("form").onsubmit = e => { e.preventDefault(); send(document.getElementById("input").value); };
    document.getElementById("input").onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(document.getElementById("input").value); }
    };
  </script>
</body>
</html>
