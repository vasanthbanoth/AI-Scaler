services:
  - type: web
    name: vasanth-persona-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: CALCOM_API_KEY
        sync: false
      - key: CALCOM_EVENT_TYPE_ID
        sync: false
      - key: CALCOM_USERNAME
        value: vasanthbanoth
      - key: VAPI_SERVER_SECRET
        generateValue: true
      - key: PYTHONPATH
        value: /app
      - key: REPO_ROOT
        value: /app
      - key: RUN_INGEST_ON_START
        value: "1"
      - key: GITHUB_USERNAME
        value: vasanthbanoth
      - key: GITHUB_TOKEN
        sync: false
      - key: NEXT_PUBLIC_VOICE_PHONE
        value: "+16574390168"
